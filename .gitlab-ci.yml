stages:
  - build
  - pack
  - publish
  - mirror

variables:
  DOTNET_VERSION: "8.0"

# ============================================
# BUILD STAGE
# ============================================

build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - echo "Restoring dependencies..."
    - dotnet restore
    - echo "Building Neo.Bpms..."
    - dotnet build --configuration Release --no-restore
  artifacts:
    paths:
      - "**/bin/Release/"
    expire_in: 1 hour
  tags:
    - docker

# ============================================
# PACK NUGET
# ============================================

pack:
  stage: pack
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - echo "Packing NuGet packages..."
    - dotnet pack --configuration Release --no-build --output ./packages
    - echo "Packages created:"
    - ls -lh ./packages/
  dependencies:
    - build
  artifacts:
    paths:
      - ./packages/*.nupkg
      - ./packages/*.snupkg
    expire_in: 30 days
  tags:
    - docker
  only:
    - master
    - develop

# ============================================
# PUBLISH TO PRIVATE NEXUS
# ============================================

publish:nexus:
  stage: publish
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - echo "Publishing to private Nexus..."
    - |
      for package in ./packages/*.nupkg; do
        echo "Publishing $package..."
        dotnet nuget push "$package" \
          --source $NEO_NEXUS_URL \
          --api-key $NEO_NEXUS_API_KEY \
          --skip-duplicate || echo "Package already exists, skipping..."
      done
    - echo "All packages published successfully!"
  dependencies:
    - pack
  tags:
    - docker
  only:
    - master
  when: manual  # Manual approval for security
  variables:
    NEO_NEXUS_URL: $NEO_NEXUS_URL
    NEO_NEXUS_API_KEY: $NEO_NEXUS_API_KEY

# ============================================
# MIRROR TO GITHUB
# ============================================

mirror:github:
  stage: mirror
  image: alpine/git
  script:
    - echo "Mirroring to GitHub..."
    - git clone --mirror $CI_REPOSITORY_URL temp-repo
    - cd temp-repo
    - git push --mirror https://$GITHUB_TOKEN@github.com/Neo-Framework/Neo-Bpms.git || true
  only:
    - master
    - develop
  when: on_success
  allow_failure: true
  tags:
    - docker
  variables:
    GITHUB_TOKEN: $GITHUB_MIRROR_TOKEN

