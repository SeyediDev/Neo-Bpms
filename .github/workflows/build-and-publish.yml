name: Build and Publish to Private Nexus

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    - name: Pack NuGet packages
      run: dotnet pack --configuration Release --no-build --output ./packages
    
    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./packages/*.nupkg
        retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - name: Download packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: ./packages
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Publish to Private Nexus
      run: |
        for package in ./packages/*.nupkg; do
          dotnet nuget push "$package" \
            --source ${{ secrets.NEO_NEXUS_URL }} \
            --api-key ${{ secrets.NEO_NEXUS_API_KEY }} \
            --skip-duplicate
        done
      env:
        NEO_NEXUS_URL: ${{ secrets.NEO_NEXUS_URL }}
        NEO_NEXUS_API_KEY: ${{ secrets.NEO_NEXUS_API_KEY }}

